{% extends "base.html" %}
{% load static %}

{% block content %}
<section id="contact" class="contact">
    <div class="container" data-aos="fade-up">
        <div class="section-title">
            <h2>Add Manager</h2>
        </div>

        <div class="row">
            <!-- Information Section -->
            

            <!-- Form Section -->
            <div class="col-lg-7 mt-5 mt-lg-0 d-flex align-items-stretch">
                <form method="post" role="form" class="php-email-form">
                    {% csrf_token %}
                    {% include "messages.html" %}
                    <div class="row">
                        <div class="form-group col-md-12">
                            <label for="username">Username</label>
                            <input type="text" name="username" class="form-control" id="username" required>
                        </div>
                        <div class="form-group col-md-12">
                            <label for="name">Name</label>
                            <input type="text" name="name" class="form-control" id="name" required>
                        </div>
                        <div class="form-group col-md-12">
                            <label for="email">Email</label>
                            <input type="email" name="email" class="form-control" id="email" required>
                        </div>
                        <div class="form-group col-md-12">
                            <label for="department">Assign Work</label>
                            <input type="text" name="department" class="form-control" id="department" required>
                        </div>
                        <div class="form-group col-md-12">
                            <label for="password">Password</label>
                            <input type="password" class="form-control" name="password" id="password" required>
                        </div>
                    </div>
                    <div class="text-center">
                        <br>
                        <br>
                        <button type="submit" class="primary-btn order-submit">Add Manager</button></div>
                </form>
            </div>
        </div>
        <div class="card mt-4">
            <div class="card-header">
                <h4>Existing Managers</h4>
            </div>
            <div class="card-body">
                <ul class="list-group">
                    {% for user in managerusers %}  <!-- Corrected variable name -->
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            {{ user.username }}  <!-- Corrected field access -->
                            <a href="{% url 'remove_user' user.id %}" class="text-danger">🗑️</a>
                        </li>
                    {% empty %}
                        <li class="list-group-item">No managers added yet.</li>
                    {% endfor %}
                </ul>
            </div>
        </div>
        
    </div>
</section>



<br>
<br>
<br>
{% endblock %}
