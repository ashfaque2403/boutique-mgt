{% extends "base.html" %}

{% block content %}

<div class="container mt-5">
    <div class="card p-4">
        <h2 class="text-center mb-4">Submit a Complaint</h2>
        <form method="POST">
            {% include "messages.html" %}

            {% csrf_token %}
            <div class="form-group mb-3">
                <label for="subject" class="form-label">Subject</label>
                <input type="text" name="subject" class="form-control" required>
            </div>
            <div class="form-group mb-3">
                <label for="complaint_text" class="form-label">Complaint</label>
                <textarea name="complaint_text" class="form-control" rows="5" required></textarea>
            </div>
            <button type="submit" class="primary-btn mt-3">Submit Complaint</button>
        </form>
    </div>
</div>

{% endblock %}
