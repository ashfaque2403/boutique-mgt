{% extends "base.html" %}
{% load static %}
{% block content %}
<br><br><br><br><br>

<div class="cart-box-main">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="billing-box shadow-lg p-4 rounded">
                    <h4 class="billing-title text-center mb-4">Billing Address</h4>
                    <form method="POST">
                        {% csrf_token %}
                        {% include "mess.html" %}
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="first_name">First Name *</label>
                                <input value="{{ form_data.first_name }}" name="first_name" type="text" class="form-control" id="first_name" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="last_name">Last Name *</label>
                                <input value="{{ form_data.last_name }}" name="last_name" type="text" class="form-control" id="last_name" required>
                            </div>
                            <div class="col-md-12 mb-3">
                                <label for="email">Email Address *</label>
                                <input value="{{ form_data.email }}" type="email" class="form-control" name="email" id="email" required>
                            </div>
                            <div class="col-md-12 mb-3">
                                <label for="address">Address *</label>
                                <input value="{{ form_data.address }}" type="text" class="form-control" name="address" id="address" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="zip">Zip Code *</label>
                                <input value="{{ form_data.zipcode }}" type="text" class="form-control" name="zipcode" id="zip" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="location">Location *</label>
                                <input value="{{ form_data.location }}" type="text" class="form-control" name="location" id="location" required>
                            </div>
                            <br>
                            <br>
                            <div class="col-md-12 text-right">
                                <button type="submit" class="primary-btn btn-lg">Update Address</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div> 
    </div>
</div>
<br><br><br>

{% endblock content %}
