{% extends 'base.html' %}
{% load static %}

{% block content %}

		<!-- NEWSLETTER -->
		<div id="newsletter" class="section">
			<!-- container -->
			<div class="container">
				<!-- row -->
				<div class="row">
					<div class="col-md-8">
						<div class="contact__form">
							<p>Sign Up for the <strong>Boutique</strong></p>
							<form method="POST"> 
								{% include "messages.html" %}
								{% csrf_token %}
								<input name="email" class="input" type="text" placeholder="Email">
                                <br>
                                <br>
								<input name="password" class="input" type="password" placeholder="Password">
                                <br>
                                <br>
								<button class="primary-btn order-submit">Login</button>
							</form>

                            <div class="text-center mt-3">
                                <p>Don't have an account? <a href="{% url 'register' %}" class="text-primary">Sign up</a></p>
                            </div>
						
						</div>
					</div>
				</div>
				<!-- /row -->
			</div>
			<!-- /container -->
		</div>
		<!-- /NEWSLETTER -->


{% endblock content %}
