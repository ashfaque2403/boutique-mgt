{% extends "base.html" %}
{% load static %}

{% block content %}
<br><br><br><br>
<div class="container">
    <div class="service-card">
        <h2 class="service-header">Edit Profile</h2>
        <form method="POST">
            {% csrf_token %}
            {% include "messages.html" %}

            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" name="name" class="form-control" value="{{ profile.name }}" required>
            </div>
            <div class="mb-3">
                <label for="phone_number" class="form-label">Phone Number</label>
                <input type="text" name="phone_number" class="form-control" value="{{ profile.phone_number }}" required>
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <textarea name="address" class="form-control" required>{{ profile.address }}</textarea>
            </div>
            <div class="mb-3">
                <label for="location" class="form-label">Location</label>
                <input type="text" name="location" class="form-control" value="{{ profile.location }}" required>
            </div>
            <button type="submit" class="btn btn-primary">Update Profile</button>
        </form>
    </div>
</div>

<style>
    /* Card Styling */
    .service-card {
        background: #fff;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        margin: 30px 0;
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
    }

    .service-header {
        text-align: center;
        color: #D10024;
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 15px;
    }

    .service-info p {
        font-size: 16px;
        color: #333;
        margin: 5px 0;
        padding: 8px;
        background: #f9f9f9;
        border-radius: 5px;
    }

    .service-info strong {
        color: #555;
    }

    /* Form Styling */
    .form-control, input, select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
        transition: 0.3s;
    }

    input:focus, select:focus {
        border-color: #D10024;
        box-shadow: 0px 0px 5px rgba(209, 0, 36, 0.5);
    }

    /* Button Styling */
    .btn-primary {
        width: 100%;
        padding: 12px;
        border: none;
        background: #D10024;
        color: white;
        font-size: 16px;
        font-weight: bold;
        border-radius: 5px;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn-primary:hover {
        background: #a6001a;
    }

    /* Payment Badge */
    .badge {
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 5px;
    }

    .bg-success {
        background: #28a745;
        color: white;
    }

    .bg-warning {
        background: #ffc107;
        color: black;
    }

    /* Table Styling */
    .table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }

    th, td {
        padding: 10px;
        text-align: center;
        border: 1px solid #ddd;
    }

    thead {
        background: #D10024;
        color: white;
    }

    tbody tr:nth-child(even) {
        background: #f8f9fa;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .service-card {
            width: 90%;
            padding: 20px;
        }
    }
</style>
{% endblock %}
